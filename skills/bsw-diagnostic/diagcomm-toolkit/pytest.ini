[pytest]
# Run the toolkit's own tests. Keep output terse by default; CI layers
# on --tb=short -v for noisier feedback.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# conftest.py adds scripts/ to sys.path; we don't need (and don't want)
# pytest's auto rootdir tricks beyond that.
addopts = -ra
